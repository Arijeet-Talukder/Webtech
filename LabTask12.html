<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Display</title>
    <style>
        .product-card {
            display: inline-block;
            width: 200px;
            border: 1px solid #ccc;
            background-color: #f0f0f0;
            padding: 15px;
            margin: 10px;
            text-align: center;
        }

        .product-card:hover {
            outline: 3px solid #007BFF;
            outline-offset: 5px;
        }
    </style>
</head>
<body>
    <div class="product-card">
        <img src="" alt="Laptop">
        <h3>Laptop</h3>
        <p>High performance laptop.</p>
        <p>$999</p>
        <a href="#">Buy Now</a>
    </div>

    <div class="product-card">
        <img src="" alt="Headphones">
        <h3>Headphones</h3>
        <p>Wireless headphones.</p>
        <p>$199</p>
        <a href="#">Buy Now</a>
    </div>

    <div class="product-card">
        <img src="" alt="Smartwatch">
        <h3>Smartwatch</h3>
        <p>Track fitness and notifications.</p>
        <p>$299</p>
        <a href="#">Buy Now</a>
    </div>
</body>
</html>
