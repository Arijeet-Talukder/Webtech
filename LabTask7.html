<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .section {
            padding: 20px;
            margin: 20px;
            border-radius: 8px;
        }

        #about {
            background-color: #ffd1d1; 
        }

        #education {
            background-color: #d1e8ff; 
        }

        #hobbies {
            background-color: #d1ffd8; 
        }

        hr {
            border: none;
            height: 4px;
            width: 80%;
            background-color: #444;
            margin: 20px auto;
        }
    </style>
</head>
<body>

    <div id="about" class="section">
        <h2>About Me</h2>
        <p style="color: blue;">Hello! I am a passionate learner who enjoys exploring new technologies.</p>
        <p>I love designing and building creative web projects.</p>
    </div>

    <hr>

    <div id="education" class="section">
        <h2>Education</h2>
        <p>I am currently studying Computer Science and continuously improving my skills.</p>
    </div>

    <hr>

    <div id="hobbies" class="section">
        <h2>Hobbies</h2>
        <p>I enjoy reading, gaming, coding, and learning new languages.</p>
    </div>

</body>
</html>
